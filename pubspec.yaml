name: vinyl_solutions
description: "Mi Biblioteca en la nube: biblioteca virtual de discos (Windows)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  just_audio: ^0.9.40
  just_audio_media_kit: ^2.0.5
  media_kit_libs_windows_audio: ^1.0.9
  http: ^1.2.2
  xml: ^6.5.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  pdfx: 2.8.0
  pdf: ^3.11.1
  image: ^4.2.0
  cryptography: ^2.7.0
  path: ^1.9.0
  window_manager: ^0.4.2
  auto_updater: ^1.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/novedades.json
    - assets/models3d/technics/
    - assets/models3d/cassette_player/
    - assets/models3d/dj/
    - assets/models3d/melodia/
    - assets/models3d/crate/
    - assets/models3d/ipod/
    - assets/models3d/ipod_front.webp
    - assets/models3d/gear/
    - assets/models3d/lupa/
    - assets/models3d/players/
    - assets/models3d/covers_search/
    - assets/models3d/disc/
    - assets/models3d/elevator/
    - assets/models3d/vinilos/
    - assets/models3d/k7/
    - assets/models3d/walkman/
    - assets/models3d/walkman_front.webp
    - assets/models3d/cassette_tape/
  shaders:
    - shaders/vinyl_sheen.frag
  fonts:
    - family: Abril
      fonts:
        - asset: assets/fonts/AbrilFatface-Regular.ttf
